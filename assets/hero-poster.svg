<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1b2c"/>
      <stop offset="0.55" stop-color="#132539"/>
      <stop offset="1" stop-color="#0b1622"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#c8a25a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c8a25a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.18" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#2f5d4f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2f5d4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8a25a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8a25a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c8a25a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- fine geometric grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- decorative rings -->
  <circle cx="1500" cy="320" r="260" fill="none" stroke="#c8a25a" stroke-opacity="0.16" stroke-width="1.5"/>
  <circle cx="1500" cy="320" r="180" fill="none" stroke="#c8a25a" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="360" cy="820" r="200" fill="none" stroke="#3d7565" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- accent hairlines -->
  <rect x="0" y="150" width="1920" height="2" fill="url(#line)"/>
  <rect x="0" y="930" width="1920" height="2" fill="url(#line)"/>

  <!-- subtle diamonds -->
  <g fill="#c8a25a" fill-opacity="0.5">
    <rect x="1495" y="315" width="12" height="12" transform="rotate(45 1501 321)"/>
  </g>
  <g fill="#3d7565" fill-opacity="0.6">
    <rect x="354" y="814" width="12" height="12" transform="rotate(45 360 820)"/>
  </g>
</svg>
